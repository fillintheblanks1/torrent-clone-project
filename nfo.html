<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xday! // NFO_VIEWER.EXE</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cursor.css">
    <style>
        .nfo-screen {
            background-color: #060606;
            border: 1px solid #333333;
            padding: 18px;
            font-family: "Courier New", Consolas, monospace;
            font-size: 12px;
            line-height: 1.35;
            color: #5cb85c;
            white-space: pre-wrap;
            overflow-x: auto;
            min-height: 440px;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.95);
        }
        .nfo-screen.theme-amber {
            color: #ffb000;
            text-shadow: 0 0 4px rgba(255, 176, 0, 0.35);
        }
        .nfo-screen.theme-white {
            color: #d8d8d8;
            text-shadow: none;
        }
        .nfo-screen.theme-green {
            color: #5cb85c;
            text-shadow: 0 0 4px rgba(92, 184, 92, 0.35);
        }
        .nfo-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            padding: 8px 10px;
            margin-bottom: 10px;
        }
        .nfo-toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .file-tree-box {
            margin-top: 10px;
            background-color: #101010;
            border: 1px solid #2b2b2b;
            padding: 10px;
            font-family: "Courier New", monospace;
            font-size: 11px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>

    <div id="cursorDot" class="cursor-dot"></div>
    <div id="cursorRing" class="cursor-ring">
        <span id="cursorCoord" class="cursor-coord">0,0</span>
    </div>

    <div class="wrapper">
        <header class="top-bar">
            <div class="brand">
                <span class="status-led"></span>
                <a href="index.html" style="text-decoration:none; color:inherit;">
                    <strong>0x<span>day!</span></strong>
                </a>
                <small id="headerFileLabel">// NFO_READER.SYS</small>
            </div>
            <div class="top-links">
                <a href="index.html" class="nav-btn">[&lt;-- Back to Index]</a>
                <button type="button" class="nav-btn" id="toggleCursorBtn">[Cursor: HUD]</button>
            </div>
        </header>

        <div class="nfo-toolbar">
            <div class="nfo-toolbar-group">
                <button type="button" class="action-btn" id="copyMagnetBtn">[Copy Magnet URI]</button>
                <button type="button" class="action-btn" id="downloadNfoBtn" style="border-color:#5cb85c; color:#5cb85c;">[Download .NFO File]</button>
                <span id="actionStatus" style="color:#5cb85c; font-weight:bold; margin-left:6px; display:none;">COPIED TO CLIPBOARD!</span>
            </div>

            <div class="nfo-toolbar-group">
                <span style="color:#888; font-size:10px;">CRT Phosphor:</span>
                <button type="button" class="nav-btn" data-theme="theme-green" style="color:#5cb85c;">[Green]</button>
                <button type="button" class="nav-btn" data-theme="theme-amber" style="color:#ffb000;">[Amber]</button>
                <button type="button" class="nav-btn" data-theme="theme-white" style="color:#dddddd;">[DOS White]</button>
            </div>
        </div>

        <pre id="nfoViewerScreen" class="nfo-screen theme-green">Loading NFO data...</pre>

        <div class="file-tree-box" id="fileTreeBox"></div>
    </div>

    <script type="module" src="js/nfo.js"></script>
</body>
</html>
